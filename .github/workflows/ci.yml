name: CI

# Every branch push: lint, test, typecheck + build. Pushes to main also deploy to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    # Branches only: tag pushes (milestone tags like m0) do not need another run.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded branch runs are cancelled; runs on main always finish so deploys never get cut off.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `build` runs the TypeScript typecheck (tsc -b) before bundling.
      - run: npm run build

      # Uploaded on every branch so any run's build can be downloaded; only main deploys it.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
